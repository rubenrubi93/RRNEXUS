<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110f"><title>Mis reservas · R&R NEXUS</title>
<style>
:root{color-scheme:dark;--bg:#07110f;--panel:#0d1916;--line:#203a32;--mint:#00d7b7;--text:#eff8f4;--muted:#9ab0a8;--danger:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#10332a 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,input{font:inherit}button,.btn{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--mint);color:#04221c;text-decoration:none;display:inline-block}.secondary{background:#18332b;color:var(--text);border:1px solid var(--line)}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#08130f;color:var(--text)}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.top,.row,.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:850;letter-spacing:.02em;font-size:21px}.brand span{color:var(--mint)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.muted,small{color:var(--muted)}h1{font-size:clamp(25px,4vw,36px);margin:20px 0 6px}h2{font-size:19px;margin:0 0 12px}.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 8px;color:var(--mint)}.msg{margin:10px 0;color:var(--mint)}.error{color:var(--danger)}.hidden{display:none!important}.empty{padding:20px;text-align:center;color:var(--muted)}button:disabled{opacity:.45;cursor:not-allowed}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script></head>
<body><main class="wrap"><header class="top"><div class="brand">R&R <span>NEXUS</span></div><a class="btn secondary" href="./index.html">Inicio</a></header>
<section id="loginPanel" class="card"><h1>Acceso de cliente</h1><p class="muted">Entra para consultar y gestionar tus reservas.</p><form id="loginForm"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><div class="actions" style="margin-top:14px"><button type="submit">Entrar</button><button type="button" class="secondary" id="forgot">He olvidado mi contraseña</button></div><div id="loginMsg" class="msg"></div></form></section>
<section id="portal" class="hidden"><h1>Mis reservas</h1><div class="row"><p id="welcome" class="muted"></p><button id="logout" class="secondary">Cerrar sesión</button></div><div class="card"><h2>Próximas sesiones</h2><p class="muted">Reserva dentro de tu ventana disponible. Si una sesión está completa, podrás apuntarte a la lista de espera si está habilitada en tu ficha.</p><div id="sessions" class="grid"></div><div id="sessionMsg" class="msg"></div></div><div class="card"><h2>Mis reservas</h2><div id="myBookings"></div><div id="bookingMsg" class="msg"></div></div><div class="card"><h2>Mi lista de espera</h2><div id="myWaitlist"></div></div></section>
</main><script>
(()=>{const $=id=>document.getElementById(id);let db,user,client,services=[],staff=[],sessions=[],bookings=[],waitlist=[],availability=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=v=>v?new Date(v).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}):'Fecha pendiente';
const msg=(id,t,error=false)=>{$(id).textContent=t;$(id).className='msg'+(error?' error':'')};
async function start(){if(!window.NEXUS_CONFIG?.supabaseUrl||!window.NEXUS_CONFIG?.supabaseAnonKey||!window.supabase){msg('loginMsg','No se ha podido cargar la configuración.',true);return}db=window.supabase.createClient(window.NEXUS_CONFIG.supabaseUrl,window.NEXUS_CONFIG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await db.auth.getSession();await sessionChanged(session);db.auth.onAuthStateChange((_e,s)=>setTimeout(()=>sessionChanged(s),0))}
async function sessionChanged(session){user=session?.user||null;$('loginPanel').classList.toggle('hidden',!!user);$('portal').classList.add('hidden');if(!user)return;const {data,error}=await db.from('crm_clients').select('id,company_id,full_name,email,weekly_booking_limit,booking_window_days,cancellation_cutoff_hours,waitlist_enabled').eq('user_id',user.id).maybeSingle();if(error||!data){await db.auth.signOut();msg('loginMsg',error?'Error al cargar tu ficha: '+error.message:'Tu usuario aún no está vinculado a una ficha de cliente. Contacta con el centro.',true);return}client=data;$('portal').classList.remove('hidden');$('welcome').textContent='Hola, '+client.full_name+'. Límite semanal: '+(client.weekly_booking_limit===0?'sin límite':client.weekly_booking_limit)+' · Reserva hasta '+client.booking_window_days+' días antes · Cancelación hasta '+client.cancellation_cutoff_hours+' h antes.';await loadPortal()}
async function loadPortal(){const co=client.company_id;const [sr,sv,st,br,wr,ar]=await Promise.all([db.from('crm_sessions').select('id,title,session_type,service_id,staff_id,starts_at,ends_at,capacity,status').eq('company_id',co).eq('status','scheduled').gte('starts_at',new Date().toISOString()).order('starts_at'),db.from('crm_services').select('id,name').eq('company_id',co),db.from('crm_staff_profiles').select('id,full_name').eq('company_id',co),db.from('crm_bookings').select('id,session_id,status,created_at').eq('company_id',co).eq('client_id',client.id).order('created_at',{ascending:false}),db.from('crm_waitlist').select('id,session_id,status,created_at').eq('company_id',co).eq('client_id',client.id).order('created_at',{ascending:false}),db.rpc('crm_client_session_availability',{p_company_id:co})]);if(sr.error){msg('sessionMsg','No se pudo cargar la agenda: '+sr.error.message,true);return}if(br.error){msg('bookingMsg','No se pudieron cargar tus reservas: '+br.error.message,true);return}sessions=sr.data||[];services=sv.data||[];staff=st.data||[];bookings=br.data||[];waitlist=wr.data||[];availability=ar.data||[];render()}
function render(){const windowEnd=Date.now()+client.booking_window_days*86400000;$('sessions').innerHTML=sessions.filter(s=>new Date(s.starts_at).getTime()<=windowEnd).map(s=>{const n=Number(availability.find(a=>a.session_id===s.id)?.booked_count||0);const service=services.find(x=>x.id===s.service_id)?.name||'Servicio';const coach=staff.find(x=>x.id===s.staff_id)?.full_name||'Equipo';const own=bookings.some(b=>b.session_id===s.id&&b.status!=='cancelled');const full=n>=s.capacity;const waiting=waitlist.some(w=>w.session_id===s.id&&w.status==='waiting');return '<article class="item"><div class="row"><strong>'+esc(s.title)+'</strong><span class="pill">'+(full?'Completa':'Plazas')+'</span></div><p class="muted">'+esc(service)+' · '+esc(coach)+'</p><p>'+dt(s.starts_at)+'<br><small>'+n+'/'+s.capacity+' plazas ocupadas</small></p><div class="actions">'+(own?'Ya tienes una reserva':full?(client.waitlist_enabled?(waiting?'En lista de espera':'<button data-wait="'+esc(s.id)+'">Unirme a lista de espera</button>'):'Lista de espera no disponible'):'<button data-book="'+esc(s.id)+'">Reservar plaza</button>')+'</div></article>'}).join('')||'<div class="empty">No hay sesiones disponibles dentro de tu ventana de reserva.</div>';
$('myBookings').innerHTML=bookings.map(b=>{const s=sessions.find(x=>x.id===b.session_id);const canCancel=b.status==='booked'&&s&&new Date(s.starts_at).getTime()-Date.now()>=client.cancellation_cutoff_hours*3600000;return '<div class="item"><div class="row"><strong>'+esc(s?.title||'Sesión')+'</strong><span class="pill">'+esc(({booked:'Reservada',attended:'Asististe',no_show:'Ausencia',cancelled:'Cancelada'})[b.status]||b.status)+'</span></div><p>'+dt(s?.starts_at)+'</p>'+(canCancel?'<button class="secondary" data-cancel="'+esc(b.id)+'">Cancelar reserva</button>':b.status==='booked'?'<small>Ya no puedes cancelar desde el portal por la antelación mínima.</small>':'')+'</div>'}).join('')||'<div class="empty">Todavía no tienes reservas.</div>';
$('myWaitlist').innerHTML=waitlist.map(w=>{const s=sessions.find(x=>x.id===w.session_id);return '<div class="item">'+esc(s?.title||'Sesión')+' · '+dt(s?.starts_at)+' · '+esc(({waiting:'En espera',promoted:'Plaza ofrecida',cancelled:'Cancelada'})[w.status]||w.status)+'</div>'}).join('')||'<div class="empty">No estás en ninguna lista de espera.</div>'}
async function reserve(id){msg('sessionMsg','');const {error}=await db.from('crm_bookings').insert({company_id:client.company_id,session_id:id,client_id:client.id,status:'booked',booked_by:user.id});if(error){msg('sessionMsg','No se pudo reservar: '+error.message,true);return}msg('sessionMsg','Reserva confirmada.');await loadPortal()}
async function joinWaitlist(id){const {error}=await db.from('crm_waitlist').insert({company_id:client.company_id,session_id:id,client_id:client.id,status:'waiting'});if(error){msg('sessionMsg','No se pudo entrar en lista de espera: '+error.message,true);return}msg('sessionMsg','Te has apuntado a la lista de espera.');await loadPortal()}
async function cancelBooking(id){if(!confirm('¿Quieres cancelar esta reserva?'))return;const {error}=await db.from('crm_bookings').update({status:'cancelled'}).eq('id',id).eq('client_id',client.id);if(error){msg('bookingMsg','No se pudo cancelar: '+error.message,true);return}msg('bookingMsg','Reserva cancelada.');await loadPortal()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg('loginMsg','Error de acceso: '+error.message,true)});$('logout').addEventListener('click',()=>db.auth.signOut());$('forgot').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){msg('loginMsg','Introduce tu correo primero.',true);return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});msg('loginMsg',error?'No se pudo enviar el correo: '+error.message:'Si el correo está registrado, recibirás instrucciones para cambiar la contraseña.',!!error)});$('sessions').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.book)reserve(b.dataset.book);if(b.dataset.wait)joinWaitlist(b.dataset.wait)});$('myBookings').addEventListener('click',e=>{const b=e.target.closest('[data-cancel]');if(b)cancelBooking(b.dataset.cancel)});start();
})();
</script></body></html>
